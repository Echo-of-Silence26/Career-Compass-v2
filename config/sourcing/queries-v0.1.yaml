inactive_query_groups:
  - query_group_id: customer-success-v0.1
    role_family: CustomerSuccess
    status: Archived
    reason: Historical CSM data remains available for baseline evaluation, but
      CSM is outside prospective sourcing scope from 2026-09-03.
  - query_group_id: it-project-management-v0.1
    role_family: ITProjectManagement
    status: Inactive
    reason: Current prospective scope contains only Growth and Product Management.
  - query_group_id: marketing-v0.1
    role_family: Marketing
    status: Inactive
    reason: >-
      No keyword vocabulary for a standalone Marketing role family exists in
      SOURCING_POLICY_MVP.md §3 (only Customer Success, Growth,
      and IT Project Management are defined there). The 10 terms previously
      active here (Product
      Marketing Manager, etc.) had no Policy provenance and are dropped
      rather than retained, per the 2026-08-30 decision that Marketing is a
      growth lever, not a target role family, and query keywords must align
      to the Policy file.
    activation_requires_new_policy_version: true
