# Run-level scope is authoritative over the legacy per-query `status` field.
# Customer Success is archived for prospective sourcing; IT Project Management
# is inactive. Only Growth and Product Management may be selected by a run.
active_query_groups: [growth-v0.1, product-management-v0.1]
archived_query_groups: [customer-success-v0.1]
inactive_query_group_ids: [it-project-management-v0.1, marketing-v0.1]
initial_run_query_group: product-management-v0.1

